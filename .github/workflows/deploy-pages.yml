# Build Next.js static export (out/) and deploy to GitHub Pages.
#
# Prereqs (repo Settings → Pages): Source = "GitHub Actions".
# Prereqs (repo Settings → Environments → github-pages): allow deployment from this workflow if prompted.
#
# Repository Variables (Settings → Secrets and variables → Actions → Variables):
#   NEXT_PUBLIC_STOCKTHEMES_MANIFEST_URL — public manifest URL (full site at build time).
#     If unset, build defaults to https://storage.googleapis.com/stockthemes-public/manifest.json
#   NEXT_PUBLIC_STOCKTHEMES_SEARCH_INDEX_URL — optional; if unset the client uses
#     <same directory as manifest>/search_index.v0.json (MosaicBot ETL uploads it with the manifest).
#   NEXT_PUBLIC_SITE_URL — no trailing slash, e.g. https://tmccode.github.io/mosaicbot_stockthemes
#     until you use a custom domain (then https://stockthemes.ai)
#   NEXT_PUBLIC_BASE_PATH — for project Pages only: /mosaicbot_stockthemes (same as repo name).
#     Leave unset when the site is served at domain root (custom domain apex).
#   NEXT_PUBLIC_BEEHIIV_SUBSCRIBE_FORM_URL — Beehiiv iframe `src` (one form for both themes), or
#   NEXT_PUBLIC_BEEHIIV_SUBSCRIBE_FORM_URL_LIGHT + _DARK — duplicate forms in Beehiiv, each styled
#     for that mode; the site swaps iframe src when the user toggles theme.
#   NEXT_PUBLIC_BEEHIIV_SUBSCRIBE_FORM_URL_MOBILE_LIGHT + _MOBILE_DARK — optional; at max-width 640px
#     the footer embed uses these instead of _LIGHT/_DARK when both are set.
#
# Beehiiv API (styled form + /api/newsletter/subscribe) does NOT work on this workflow: the site
# is output: "export" with no server. Do not add BEEHIIV_API_KEY / BEEHIIV_PUBLICATION_ID here
# unless you change hosting to Node/serverless (e.g. Vercel). Then remove STOCKTHEMES_STATIC_PAGES
# from the build env and add those as Repository secrets.
#
# Google AdSense (optional Repository Variables): NEXT_PUBLIC_ADSENSE_CLIENT + SLOT_* for each unit
# (hero, rails, strips, groups/themes index rail+strip, home discovery mid, theme chart end — optional except client).
# PostHog (optional but recommended): NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN (or NEXT_PUBLIC_POSTHOG_KEY),
# NEXT_PUBLIC_POSTHOG_HOST, and optional NEXT_PUBLIC_POSTHOG_DEBUG (leave unset/0 in prod).
# prebuild writes public/ads.txt from NEXT_PUBLIC_ADSENSE_CLIENT (required at https://<domain>/ads.txt),
# and public/search_index.v0.json from the public bucket so search loads same-origin (see scripts/fetch-search-index.mjs).
#
# GCS: bucket CORS must allow GET from every origin that loads the site (e.g. https://stockthemes.ai),
# or browser chart hydration will fail. See MosaicBot docs/stockthemes/gcs-cors.example.json

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Rebuild static site so layout/footer `manifest.as_of` matches GCS JSON (output: export).
  # Cron is UTC only. Below uses US Eastern Standard Time (EST = UTC-5). During EDT (~Mar–Nov),
  # local times are one hour later than the labels (e.g. 11:00 UTC = 6am EST / 7am EDT).
  schedule:
    - cron: "0 11 * * *" # daily 06:00 Eastern (standard)
    - cron: "0 16 * * 1-5" # Mon–Fri 11:00 Eastern (standard)
    - cron: "0 19 * * 1-5" # Mon–Fri 14:00 Eastern (standard)
    - cron: "0 23 * * 1-5" # Mon–Fri 18:00 Eastern (standard)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          STOCKTHEMES_STATIC_PAGES: "1"
          NEXT_PUBLIC_STOCKTHEMES_MANIFEST_URL: ${{ vars.NEXT_PUBLIC_STOCKTHEMES_MANIFEST_URL }}
          NEXT_PUBLIC_STOCKTHEMES_SEARCH_INDEX_URL: ${{ vars.NEXT_PUBLIC_STOCKTHEMES_SEARCH_INDEX_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH }}
          NEXT_PUBLIC_BEEHIIV_SUBSCRIBE_FORM_URL: ${{ vars.NEXT_PUBLIC_BEEHIIV_SUBSCRIBE_FORM_URL }}
          NEXT_PUBLIC_BEEHIIV_SUBSCRIBE_FORM_URL_LIGHT: ${{ vars.NEXT_PUBLIC_BEEHIIV_SUBSCRIBE_FORM_URL_LIGHT }}
          NEXT_PUBLIC_BEEHIIV_SUBSCRIBE_FORM_URL_DARK: ${{ vars.NEXT_PUBLIC_BEEHIIV_SUBSCRIBE_FORM_URL_DARK }}
          NEXT_PUBLIC_BEEHIIV_SUBSCRIBE_FORM_URL_MOBILE_LIGHT: ${{ vars.NEXT_PUBLIC_BEEHIIV_SUBSCRIBE_FORM_URL_MOBILE_LIGHT }}
          NEXT_PUBLIC_BEEHIIV_SUBSCRIBE_FORM_URL_MOBILE_DARK: ${{ vars.NEXT_PUBLIC_BEEHIIV_SUBSCRIBE_FORM_URL_MOBILE_DARK }}
          NEXT_PUBLIC_ADSENSE_CLIENT: ${{ vars.NEXT_PUBLIC_ADSENSE_CLIENT }}
          NEXT_PUBLIC_ADSENSE_SLOT_HERO: ${{ vars.NEXT_PUBLIC_ADSENSE_SLOT_HERO }}
          NEXT_PUBLIC_ADSENSE_SLOT_THEME_RAIL: ${{ vars.NEXT_PUBLIC_ADSENSE_SLOT_THEME_RAIL }}
          NEXT_PUBLIC_ADSENSE_SLOT_GROUP_RAIL: ${{ vars.NEXT_PUBLIC_ADSENSE_SLOT_GROUP_RAIL }}
          NEXT_PUBLIC_ADSENSE_SLOT_GROUP_STRIP: ${{ vars.NEXT_PUBLIC_ADSENSE_SLOT_GROUP_STRIP }}
          NEXT_PUBLIC_ADSENSE_SLOT_GROUPS_INDEX_RAIL: ${{ vars.NEXT_PUBLIC_ADSENSE_SLOT_GROUPS_INDEX_RAIL }}
          NEXT_PUBLIC_ADSENSE_SLOT_GROUPS_INDEX_STRIP: ${{ vars.NEXT_PUBLIC_ADSENSE_SLOT_GROUPS_INDEX_STRIP }}
          NEXT_PUBLIC_ADSENSE_SLOT_THEMES_INDEX_RAIL: ${{ vars.NEXT_PUBLIC_ADSENSE_SLOT_THEMES_INDEX_RAIL }}
          NEXT_PUBLIC_ADSENSE_SLOT_THEMES_INDEX_STRIP: ${{ vars.NEXT_PUBLIC_ADSENSE_SLOT_THEMES_INDEX_STRIP }}
          NEXT_PUBLIC_ADSENSE_SLOT_HOME_DISCOVERY_MID: ${{ vars.NEXT_PUBLIC_ADSENSE_SLOT_HOME_DISCOVERY_MID }}
          NEXT_PUBLIC_ADSENSE_SLOT_THEME_CHART_END: ${{ vars.NEXT_PUBLIC_ADSENSE_SLOT_THEME_CHART_END }}
          NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ vars.NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
          NEXT_PUBLIC_POSTHOG_DEBUG: ${{ vars.NEXT_PUBLIC_POSTHOG_DEBUG }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
