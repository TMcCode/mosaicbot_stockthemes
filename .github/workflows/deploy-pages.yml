# Build Next.js static export (out/) and deploy to Cloudflare Pages.
#
# Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# (Token needs Cloudflare Pages + Account read; TimBot uses the same
# “Edit Cloudflare Workers” token template.)
#
# Egress controls:
# - Scheduled runs (and VPS dispatches with skip_if_unchanged) skip build when manifest/home_trending
#   as_of match the last successful deploy (stockthemes-deploy-meta-* cache, saved after deploy).
# - Code pushes rebuild static HTML but reuse public R2/cache unless publish data changed.
# - Build cache is saved per run (stockthemes-public-v5-<run_id>) and restored from the newest
#   prefix match — Actions cache entries are immutable, so a fixed key would never refresh.
# - STOCKTHEMES_BUILD_CACHE + sync-build-cache.mjs use per-object ETag (not full-catalog pulls on as_of bump).
# - NEXT_PUBLIC_STOCKTHEMES_DISABLE_LIVE_HYDRATE=1 — no full theme JSON hydrate for chart performance.
# - NEXT_PUBLIC_STOCKTHEMES_LIVE_PRICE_RETURNS=1 — refresh constituent price_returns from CDN (~5 min).
# - NEXT_PUBLIC_STOCKTHEMES_LIVE_CHART_PERFORMANCE=1 — refresh performance chart via chart sidecar (~5 min).
# - NEXT_PUBLIC_STOCKTHEMES_LIVE_COMPARE_RETURNS=1 — refresh home/compare aggregates (~5 min).
# - NEXT_PUBLIC_STOCKTHEMES_LIVE_COMPOSITION=1 — one-shot full theme/group JSON for composition_indexed
#   (Pages seeds only performance; price_returns sidecars omit chart_1y; bypasses DISABLE_LIVE_HYDRATE).
# - Default manifest URL: https://storage.stockthemes.ai (R2 custom domain), not storage.googleapis.com.
#
# See docs/R2_MIGRATION.md

name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  # Primary trigger: MosaicBot VPS dispatches this workflow right after fetcheoddata / full manifest /
  # price-only publishes (scripts/vps/trigger-stockthemes-pages.sh). Crons below are a backstop —
  # GitHub often starts them hours late or drops them.
  # Daily 5:00 AM ET — bake overnight fetcheoddata manifest (~1 AM ET) into static Pages.
  # Weekdays: 3× ~45m after full manifest (11:15 / 15:15 / 18:15 ET) — catches price-only as_of bumps too.
  # Push always rebuilds; schedule skips build when manifest/home_trending as_of unchanged (ci-should-build.mjs).
  # UTC below is EDT (UTC-4). After US fall back: "0 10 * * *" and "30 15,19,22 * * 1-5".
  schedule:
    - cron: "0 9 * * *"
    - cron: "30 14,18,21 * * 1-5"
  workflow_dispatch:
    inputs:
      force_build:
        description: "Rebuild even if manifest.as_of unchanged"
        required: false
        default: false
        type: boolean
      refresh_cache:
        description: "Force full re-download of all theme/group JSON from CDN"
        required: false
        default: false
        type: boolean
      skip_if_unchanged:
        description: "Skip build when publish as_of matches last deploy (VPS dispatch)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      full_cache_refresh: ${{ steps.check.outputs.full_cache_refresh }}
      skip_reason: ${{ steps.check.outputs.reason }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore last deploy meta
        uses: actions/cache/restore@v4
        with:
          path: .cache/stockthemes-public/_pages_deploy_meta.json
          key: stockthemes-deploy-meta-${{ github.run_id }}
          restore-keys: |
            stockthemes-deploy-meta-

      - name: Decide if build is needed
        id: check
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          FORCE_BUILD: ${{ github.event.inputs.force_build }}
          REFRESH_CACHE: ${{ github.event.inputs.refresh_cache }}
          SKIP_IF_UNCHANGED: ${{ github.event.inputs.skip_if_unchanged }}
          STOCKTHEMES_SYNC_VIA_R2: "1"
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: node scripts/ci-should-build.mjs

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Restore R2 build cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/stockthemes-public
            .cache/generated-assets
          key: stockthemes-public-v5-${{ github.run_id }}
          restore-keys: |
            stockthemes-public-v5-
            stockthemes-public-v4

      - name: Install dependencies
        run: npm ci

      # Fresh desk posts before sync (Substack RSS + Beehiiv). Continue if Beehiiv secrets missing.
      - name: Bake newsletter posts to R2
        continue-on-error: true
        run: npm run bake:newsletter
        env:
          STOCKTHEMES_PUBLIC_BUCKET: stockthemes-public
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          BEEHIIV_API_KEY: ${{ secrets.BEEHIIV_API_KEY }}
          BEEHIIV_PUBLICATION_ID: ${{ secrets.BEEHIIV_PUBLICATION_ID }}

      - name: Sync public JSON from CDN into build cache
        run: node scripts/sync-public-json-ci.mjs
        env:
          STOCKTHEMES_BUILD_CACHE: "1"
          STOCKTHEMES_SYNC_VIA_R2: "1"
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          FULL_CACHE_REFRESH: ${{ needs.check.outputs.full_cache_refresh }}

      - name: Build static export
        # Stock pages: fixtures/allowlist SSG only. Long tail = Pages Function
        # (functions/stocks/[ticker].js → /stocks/__shell). Keep STOCKTHEMES_SYNC_STOCKS=0
        # (full ~8k bake ≈89k files > CF Pages 20k). Optional: STOCKTHEMES_SYNC_STOCK_TICKERS=AAPL,MSFT.
        # report:export fails if files≥20k.
        run: npm run build && npm run verify:budgets && npm run report:export && node scripts/write-pages-deploy-meta.mjs
        env:
          # Code pushes fail on page-size regressions; scheduled data refreshes only warn so a
          # data-driven spike never blocks fresh numbers. Repo var overrides both.
          STOCKTHEMES_ENFORCE_BUNDLE_BUDGET: ${{ vars.STOCKTHEMES_ENFORCE_BUNDLE_BUDGET || (github.event_name == 'push' && '1' || '0') }}
          STOCKTHEMES_SYNC_STOCKS: ${{ vars.STOCKTHEMES_SYNC_STOCKS || '0' }}
          STOCKTHEMES_SYNC_STOCK_TICKERS: ${{ vars.STOCKTHEMES_SYNC_STOCK_TICKERS || '' }}
          STOCKTHEMES_STATIC_PAGES: "1"
          STOCKTHEMES_BUILD_CACHE: "1"
          STOCKTHEMES_SYNC_VIA_R2: "1"
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          NEXT_PUBLIC_STOCKTHEMES_DISABLE_LIVE_HYDRATE: "1"
          NEXT_PUBLIC_STOCKTHEMES_LIVE_PRICE_RETURNS: "1"
          NEXT_PUBLIC_STOCKTHEMES_LIVE_CHART_PERFORMANCE: "1"
          NEXT_PUBLIC_STOCKTHEMES_LIVE_COMPARE_RETURNS: "1"
          NEXT_PUBLIC_STOCKTHEMES_LIVE_COMPOSITION: "1"
          NEXT_PUBLIC_STOCKTHEMES_PRICE_REVALIDATE_SEC: "300"
          NEXT_PUBLIC_STOCKTHEMES_MANIFEST_URL: ${{ vars.NEXT_PUBLIC_STOCKTHEMES_MANIFEST_URL }}
          NEXT_PUBLIC_STOCKTHEMES_SEARCH_INDEX_URL: ${{ vars.NEXT_PUBLIC_STOCKTHEMES_SEARCH_INDEX_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH }}
          NEXT_PUBLIC_BEEHIIV_SUBSCRIBE_FORM_URL: ${{ vars.NEXT_PUBLIC_BEEHIIV_SUBSCRIBE_FORM_URL }}
          NEXT_PUBLIC_BEEHIIV_SUBSCRIBE_FORM_URL_LIGHT: ${{ vars.NEXT_PUBLIC_BEEHIIV_SUBSCRIBE_FORM_URL_LIGHT }}
          NEXT_PUBLIC_BEEHIIV_SUBSCRIBE_FORM_URL_DARK: ${{ vars.NEXT_PUBLIC_BEEHIIV_SUBSCRIBE_FORM_URL_DARK }}
          NEXT_PUBLIC_BEEHIIV_SUBSCRIBE_FORM_URL_MOBILE_LIGHT: ${{ vars.NEXT_PUBLIC_BEEHIIV_SUBSCRIBE_FORM_URL_MOBILE_LIGHT }}
          NEXT_PUBLIC_BEEHIIV_SUBSCRIBE_FORM_URL_MOBILE_DARK: ${{ vars.NEXT_PUBLIC_BEEHIIV_SUBSCRIBE_FORM_URL_MOBILE_DARK }}
          NEXT_PUBLIC_ADSENSE_CLIENT: ${{ vars.NEXT_PUBLIC_ADSENSE_CLIENT }}
          NEXT_PUBLIC_ADSENSE_SLOT_HERO: ${{ vars.NEXT_PUBLIC_ADSENSE_SLOT_HERO }}
          NEXT_PUBLIC_ADSENSE_SLOT_THEME_RAIL: ${{ vars.NEXT_PUBLIC_ADSENSE_SLOT_THEME_RAIL }}
          NEXT_PUBLIC_ADSENSE_SLOT_GROUP_RAIL: ${{ vars.NEXT_PUBLIC_ADSENSE_SLOT_GROUP_RAIL }}
          NEXT_PUBLIC_ADSENSE_SLOT_GROUP_STRIP: ${{ vars.NEXT_PUBLIC_ADSENSE_SLOT_GROUP_STRIP }}
          NEXT_PUBLIC_ADSENSE_SLOT_GROUPS_INDEX_RAIL: ${{ vars.NEXT_PUBLIC_ADSENSE_SLOT_GROUPS_INDEX_RAIL }}
          NEXT_PUBLIC_ADSENSE_SLOT_GROUPS_INDEX_STRIP: ${{ vars.NEXT_PUBLIC_ADSENSE_SLOT_GROUPS_INDEX_STRIP }}
          NEXT_PUBLIC_ADSENSE_SLOT_THEMES_INDEX_RAIL: ${{ vars.NEXT_PUBLIC_ADSENSE_SLOT_THEMES_INDEX_RAIL }}
          NEXT_PUBLIC_ADSENSE_SLOT_THEMES_INDEX_STRIP: ${{ vars.NEXT_PUBLIC_ADSENSE_SLOT_THEMES_INDEX_STRIP }}
          NEXT_PUBLIC_ADSENSE_SLOT_HOME_DISCOVERY_MID: ${{ vars.NEXT_PUBLIC_ADSENSE_SLOT_HOME_DISCOVERY_MID }}
          NEXT_PUBLIC_ADSENSE_SLOT_THEME_CHART_END: ${{ vars.NEXT_PUBLIC_ADSENSE_SLOT_THEME_CHART_END }}
          NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ vars.NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
          NEXT_PUBLIC_POSTHOG_DEBUG: ${{ vars.NEXT_PUBLIC_POSTHOG_DEBUG }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-out
          path: out
          retention-days: 3

      - name: Upload deploy meta
        uses: actions/upload-artifact@v4
        with:
          name: deploy-meta
          path: .cache/stockthemes-public/_pages_deploy_meta.json
          include-hidden-files: true
          retention-days: 3

  deploy:
    needs: [check, build]
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      # Functions + wrangler.toml must sit next to `out/` for `pages deploy`
      # (Tier B /cdn-app proxy). Artifact is static HTML only.
      - name: Checkout Functions + wrangler
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            functions
            wrangler.toml
          sparse-checkout-cone-mode: false

      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site-out
          path: out

      - name: Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          resp=$(curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/stockthemes")
          ok=$(echo "$resp" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("success"))')
          if [ "$ok" = "True" ]; then
            echo "Project stockthemes already exists"
            exit 0
          fi
          echo "Creating Pages project stockthemes..."
          curl -sS -X POST -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects" \
            -d '{"name":"stockthemes","production_branch":"main"}' \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print("success", d.get("success")); print("errors", d.get("errors")); raise SystemExit(0 if d.get("success") else 1)'

      - name: Deploy to Cloudflare Pages
        id: deployment
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.14.1"
          command: pages deploy out --project-name=stockthemes --commit-dirty=true

      - name: Verify Tier B /cdn-app gate (stocks + themes)
        continue-on-error: true
        run: |
          set -euo pipefail
          anon=$(curl -sS -o /dev/null -w "%{http_code}" "https://stockthemes.ai/cdn-app/stocks/AAPL.price_returns.v0.json")
          with_origin=$(curl -sS -o /dev/null -w "%{http_code}" -H "Origin: https://stockthemes.ai" \
            "https://stockthemes.ai/cdn-app/stocks/AAPL.price_returns.v0.json")
          public=$(curl -sS -o /dev/null -w "%{http_code}" \
            "https://storage.stockthemes.ai/stocks/AAPL.price_returns.v0.json")
          echo "anon=/cdn-app stock price_returns → $anon (expect 403)"
          echo "origin=/cdn-app stock price_returns → $with_origin (expect 200 or 404)"
          echo "public CDN stock price_returns → $public (expect 404)"
          test "$anon" = "403" || test "$anon" = "401"
          test "$with_origin" = "200" || test "$with_origin" = "404"
          test "$public" = "404" || test "$public" = "403"

      # Record what is live only after Pages accepted it — the next gated run compares against this.
      - name: Download deploy meta
        uses: actions/download-artifact@v4
        with:
          name: deploy-meta
          path: .cache/stockthemes-public

      - name: Save deploy meta cache
        uses: actions/cache/save@v4
        with:
          path: .cache/stockthemes-public/_pages_deploy_meta.json
          key: stockthemes-deploy-meta-${{ github.run_id }}

      - name: Attach stockthemes.ai (if missing)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          domains_json=$(curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/stockthemes/domains")
          echo "$domains_json" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("api_ok", d.get("success"));
          [print("domain", x.get("name"), x.get("status")) for x in (d.get("result") or [])]'
          has_apex=$(echo "$domains_json" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(any(x.get("name")=="stockthemes.ai" for x in (d.get("result") or [])))')
          has_www=$(echo "$domains_json" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(any(x.get("name")=="www.stockthemes.ai" for x in (d.get("result") or [])))')
          if [ "$has_apex" != "True" ]; then
            echo "Adding stockthemes.ai..."
            curl -sS -X POST -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/stockthemes/domains" \
              -d '{"name":"stockthemes.ai"}' | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("success"), d.get("errors"))'
          fi
          if [ "$has_www" != "True" ]; then
            echo "Adding www.stockthemes.ai..."
            curl -sS -X POST -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/stockthemes/domains" \
              -d '{"name":"www.stockthemes.ai"}' | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("success"), d.get("errors"))'
          fi

      # Custom-domain edge can cache 404s for `/_next/static/chunks/*` with max-age=1y
      # (tilde→underscore rename race). Purge when CLOUDFLARE_ZONE_ID is set.
      - name: Purge stockthemes.ai static chunk cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ZONE_ID:-}" ]; then
            echo "CLOUDFLARE_ZONE_ID unset — skip purge (new -st busted chunk URLs still avoid poisoned 404s)"
            exit 0
          fi
          curl -sS -X POST -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -d '{"prefixes":["stockthemes.ai/_next/static/","www.stockthemes.ai/_next/static/"]}' \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print("purge", d.get("success"), d.get("errors")); raise SystemExit(0)'
          # Never fail the deploy on purge — token may lack Zone.Cache Purge.
          # New -st busted chunk URLs already avoid poisoned 404 HITs.

  skip_notice:
    needs: check
    if: needs.check.outputs.should_build != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Skipped
        run: |
          echo "Pages deploy skipped: ${{ needs.check.outputs.skip_reason }}"
          echo "Use workflow_dispatch with force_build=true to rebuild anyway."
